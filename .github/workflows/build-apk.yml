name: Build WiFi Sentinel APK (Android 14 / API 34)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Sentinel Unit Tests (Phases 1-3)
        run: ./gradlew testDebugUnitTest --tests "com.example.wifisentinel.*" --info

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Sentinel-v1.0.2-API34
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
