name: Build WiFi Sentinel APK (Android 14 / API 34)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Sentinel Unit Tests (Phases 1-3)
        run: ./gradlew testDebugUnitTest --tests "com.example.wifisentinel.*" --info

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WiFi-Sentinel-v1.0.2-API34.apk

      - name: Upload APK Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Sentinel-v1.0.2-API34
          path: app/build/outputs/apk/debug/WiFi-Sentinel-v1.0.2-API34.apk
          retention-days: 14

      - name: Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.2 app/build/outputs/apk/debug/WiFi-Sentinel-v1.0.2-API34.apk \
            --title "WiFi Sentinel v1.0.2 (API 34) - Production Release" \
            --notes "### Global Opifex Hub-SIEM • WiFi Sentinel v1.0.2 (Android 14 / API 34)

          **Lead Architect**: Liberty Tendai Kondo (GOIS9836 / libertykondo9836@gmail.com)
          **Node Identifier**: Nodes-Pergamus | **Standards**: POTRAZ CDPA [Chapter 12:07] • CISSP D5/D8 • SSCP D1

          #### 🛡️ Release Highlights:
          - **Strict Zero-Tolerance IoT Policy**: Automated detection, hardware profiling, and isolation of rogue Espressif (ESP32/ESP8266), Tuya/Realtek, and Raspberry Pi audit hardware.
          - **IoT Telemetry Sinkholes**: 0.0.0.0 null-routing for unauthorized smart home and microcontroller telemetry (MQTT 1883, SSDP 1900, mDNS 5353).
          - **24-Test SOC Tactical Battery**: 100% test coverage with Apex DataHub streaming integration (:8721).
          - **DEX Dynamic Code Loading & Admin App Forensics**: Dalvik bytecode analysis and unauthorized admin apps containment.
          - **POTRAZ Chapter 12:07 Privacy Invariant**: Salted HMAC-SHA256 pseudonymized identifiers and 0.00% drift." \
            --latest
