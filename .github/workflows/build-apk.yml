name: Build WiFi Sentinel APK (Android 14 / API 34)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Sentinel Unit Tests (Phases 1-3)
        run: ./gradlew testDebugUnitTest --tests "com.example.wifisentinel.*" --info

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset & Extract Version
        id: version_info
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.3")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/WiFi-Sentinel-v${VERSION}-API34.apk"
          echo "Asset prepared: WiFi-Sentinel-v${VERSION}-API34.apk"

      - name: Upload APK Pipeline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Sentinel-API34
          path: app/build/outputs/apk/debug/WiFi-Sentinel-v*-API34.apk
          retention-days: 14

      - name: Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${APP_VERSION}"
          APK_FILE="app/build/outputs/apk/debug/WiFi-Sentinel-${TAG_NAME}-API34.apk"
          gh release delete "${TAG_NAME}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG_NAME}" "${APK_FILE}" \
            --title "WiFi Sentinel ${TAG_NAME} (API 34) - Production Release" \
            --notes "### Global Opifex Hub-SIEM • WiFi Sentinel ${TAG_NAME} (Android 14 / API 34)

          **Lead Architect**: Liberty Tendai Kondo (GOIS9836-ARCHITECT / [POTRAZ-CDPA-OBSCURED])
          **Node Identifier**: Nodes-Pergamus | **Standards**: POTRAZ CDPA [Chapter 12:07] • CISSP D5/D8 • SSCP D1

          #### 🛡️ Release Highlights:
          - **POTRAZ Chapter 12:07 Statutory Baseline**: Native MSISDN, SIM ICCID, and IMSI pseudonymization (`MacSanitizer.kt`), restricted TLD/C2 sinkhole filtering, and Room SQLite alert PII scrubbing.
          - **Cubot KingKong 9 Mobile Fortress Guard**: Virtual container (`Parallel Space`, `VirtualXposed`) and modded clone APK (`GBWhatsApp`, `FMWhatsApp`) detection alongside Wireless ADB port `5555` (`0x15B3`) and local backdoor socket inspection.
          - **Real-Time Rogue AP & Evil Twin Sentry**: Detects security downgrade attacks (WPA2/WPA3 to OPEN/WEP), LAA randomized BSSID SoftAPs, and unauthorized mesh beacons.
          - **Resource-Frugal Gemini AI Cache**: Deterministic SHA-256 telemetry digest caching with 15-minute TTL and zero-drift reuse.
          - **Strict Zero-Tolerance IoT Policy**: Automated detection and isolation of rogue Espressif (ESP32/ESP8266), Tuya/Realtek, and Raspberry Pi audit hardware.
          - **36-Test SOC Tactical Battery**: 100% test coverage with Apex DataHub streaming integration (:8721) and 0.00% drift." \
            --latest
